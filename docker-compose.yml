name: reserva-horas-medicas

services:
  web:
    build: .
    image: reserva-horas-medicas:1.0.0
    container_name: reserva-horas-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
